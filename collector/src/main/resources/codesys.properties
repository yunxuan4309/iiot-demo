# ─────────────────────────────────────────────────────────────
# CODESYS 软 PLC（Modbus TCP Server）点表 —— 真 PLC 运行时，不是仿真设备
#
# 实测于 2026-10-24，配置见 docs/CODESYS/Modbus从站接入与实测.md
#
# CODESYS 侧的映射（关键：方向和直觉相反）：
#   %QW0..%QW1  →  Modbus【输入寄存器】FC04   ← rTemp : REAL 占 2 个字
#   %QX0.0      →  Modbus【离散输入】  FC02   ← xAlarm : BOOL
#   %IW…        →  Modbus【保持寄存器】FC03   （本工程没用）
#   %IX…        →  Modbus【线圈】      FC01   （本工程没用）
#
# ★ 实测字序 = CDAB（低位字在前）。用 90.1 这种带小数的值验出来的：
#     90.1 = 0x42B43333 → reg[0]=0x3333, reg[1]=0x42B4
#     用 90.0 验不出来（0x42B40000 低位字是 0，两种解释都显示 90.00）
# ─────────────────────────────────────────────────────────────

device.plc-01.portType=tcp
device.plc-01.host=127.0.0.1
device.plc-01.port=1503
device.plc-01.unitId=1
device.plc-01.periodMillis=1000
device.plc-01.points=temperature,alarm

# rTemp : REAL → 输入寄存器 offset 0..1
device.plc-01.point.temperature.area=input
device.plc-01.point.temperature.offset=0
device.plc-01.point.temperature.type=float32
device.plc-01.point.temperature.order=CDAB
device.plc-01.point.temperature.unit=°C
device.plc-01.point.temperature.min=-40
device.plc-01.point.temperature.max=200

# xAlarm : BOOL → 离散输入 offset 0
device.plc-01.point.alarm.area=discrete
device.plc-01.point.alarm.offset=0
device.plc-01.point.alarm.type=bool
device.plc-01.point.alarm.unit=
