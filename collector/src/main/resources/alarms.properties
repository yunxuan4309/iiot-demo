# ─────────────────────────────────────────────────────────────
# 告警规则（现场改参数不用改代码）
#
# 每个点位四项：
#   warningHigh      预警阈值
#   criticalHigh     严重阈值（必须 > warningHigh）
#   recoverOffset    回差：恢复阈值 = 触发阈值 − 本值
#   durationMillis   越限必须持续多久才真正报警（去抖）
#
# 温度这台表：正常 62℃，报警线 80℃。
#   > 80 且持续 5 秒  → WARNING
#   > 85 且持续 5 秒  → CRITICAL
#   回落到 75（80−5）→ 清除 WARNING
#   回落到 80（85−5）→ 清除 CRITICAL
#
# 为什么回差要 5℃：温度有 ±2℃ 的高频噪声，
# 若恢复阈值 = 触发阈值，值在 80 附近抖动会反复 RAISE/CLEAR。
# ─────────────────────────────────────────────────────────────
alarm.temperature.warningHigh=80
alarm.temperature.criticalHigh=85
alarm.temperature.recoverOffset=5
alarm.temperature.durationMillis=5000
