# ─────────────────────────────────────────────────────────────
# CODESYS PLC 点表 —— 「可写」版本（配合 BridgeMain 用）
#
# 与 codesys.properties 的区别：多了 temp_in 这个**可写**点（保持寄存器 offset 0 = %IW0），
# 让采集端能把真传感器读到的温度**写进 PLC**，PLC 再用它做判断。
#
# ⚠️ 前提：CODESYS 里 ModbusTCP_Server_Device 的「保持寄存器」那行必须**勾上「可写入」**，
#          否则主站写入会被回异常码（Illegal Data Address / 无权限）。
#
# 数据流：
#   真传感器(COM7/RTU) ──BridgeMain 读──→ 24.7
#                                        ↓ ÷0.1
#                          写 247 到 %IW0（保持寄存器 offset 0）
#                                        ↓
#                    PLC: rTemp := WORD_TO_REAL(%IW0)/10 → 24.7 → xAlarm
#                                        ↓
#                    PLC 把 rTemp 暴露成输入寄存器(FC04) → 本程序再读回来
# ─────────────────────────────────────────────────────────────

device.plc-01.portType=tcp
device.plc-01.host=127.0.0.1
device.plc-01.port=1503
device.plc-01.unitId=1
device.plc-01.periodMillis=1000
device.plc-01.points=temp_in,temperature,alarm

# ★ 写入口：保持寄存器 offset 0 = %IW0（PLC 从这读温度）
#    type=uint16 + scale=0.1 → 写 247 表示 24.7℃（BridgeMain 会做 ÷scale）
device.plc-01.point.temp_in.area=holding
device.plc-01.point.temp_in.offset=0
device.plc-01.point.temp_in.type=uint16
device.plc-01.point.temp_in.scale=0.1
device.plc-01.point.temp_in.unit=°C

# 读回：输入寄存器 offset 0..1 = PLC 里的 rTemp（REAL，占两个字）
#    ⚠️ 字序 CDAB 是 2026-10-24 用 90.1 实测出来的，别改
device.plc-01.point.temperature.area=input
device.plc-01.point.temperature.offset=0
device.plc-01.point.temperature.type=float32
device.plc-01.point.temperature.order=CDAB
device.plc-01.point.temperature.unit=°C
device.plc-01.point.temperature.min=-40
device.plc-01.point.temperature.max=200

# 读回：离散输入 offset 0 = PLC 的 xAlarm
device.plc-01.point.alarm.area=discrete
device.plc-01.point.alarm.offset=0
device.plc-01.point.alarm.type=bool
