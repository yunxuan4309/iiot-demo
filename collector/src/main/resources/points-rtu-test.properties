# ─────────────────────────────────────────────────────────────
# RTU 自测点表（com0com 虚拟串口 + 第三方 Modbus RTU 从站）
#
# 目的：在没有真实硬件的情况下，验证 RtuModbusDriver **真的能从串口读到数**。
#
# 接线（虚拟）：  COM5  ←→  COM6
#                 ↑第三方从站   ↑我们（主站）
#
# 实测记录 2026-10-24：
#   COM5 ↔ COM6 用 .NET SerialPort 直连收发验证通过（双向各 15 字节）
#   com0com 3.0.0.0 signed · 注册表证实 com0com11=COM6 / com0com21=COM5 是一对
#
# 真硬件到货后：把 comPort 改成 USB-485 实际占用的那个号（设备管理器里看），
#              其余**一个字都不用改**。
# ─────────────────────────────────────────────────────────────

device.rtu-test.portType=rtu
device.rtu-test.comPort=COM6
device.rtu-test.baudRate=9600
device.rtu-test.dataBits=8
device.rtu-test.stopBits=1
device.rtu-test.parity=none
device.rtu-test.rs485Mode=false
device.rtu-test.unitId=1
device.rtu-test.periodMillis=1000
device.rtu-test.points=temperature

# 温度：保持寄存器 offset 0..1（Float32 占 2 个字）
# ⚠️ 字序先用 ABCD 占位 —— 真值以 `run-probe --com COM6` 的四种解析结果为准，
#    只有一种能解出你在从站里填的那个数（记得填**带小数**的值，比如 25.5）
device.rtu-test.point.temperature.area=holding
device.rtu-test.point.temperature.offset=0
device.rtu-test.point.temperature.type=float32
device.rtu-test.point.temperature.order=ABCD
device.rtu-test.point.temperature.unit=°C
device.rtu-test.point.temperature.min=-40
device.rtu-test.point.temperature.max=200
