# ─────────────────────────────────────────────────────────────
# RS485 传感器点表模板（RTU）
#
# 到货后只需改 4 个地方：
#   1. comPort       ← 设备管理器里看到的 COM 口
#   2. baudRate      ← 查手册；出厂常见 9600
#   3. parity        ← 出厂常见 none（即 8N1）
#   4. point.*.order ← ★ 用 probe 现场判定，不要抄
#
# 用法：
#   collector\run-probe.cmd --com COM3 --baud 9600          ← 先探，确认能读到 + 定字序
#   collector\run-collect.cmd --points points-rtu.properties --cycles 5
#   collector\run-multi-tdengine.cmd --points points-rtu.properties --fanout 1
# ─────────────────────────────────────────────────────────────

# ── 设备接入 ──
device.rtu-01.portType=rtu
device.rtu-01.comPort=COM3
device.rtu-01.baudRate=9600
device.rtu-01.dataBits=8
device.rtu-01.stopBits=1
device.rtu-01.parity=none
# USB-485 转换器（FT232 等）自动切方向 → 保持 false
# 只有板载原生 485 口才改成 true
device.rtu-01.rs485Mode=false
device.rtu-01.unitId=1

# RTU 是半双工，周期给宽一点更稳（2000ms 起步）
device.rtu-01.periodMillis=2000
device.rtu-01.points=temperature,humidity

# ── 温度（示例：手册写"寄存器 0x0000，Float32，只读"）──
device.rtu-01.point.temperature.area=holding
device.rtu-01.point.temperature.offset=0
device.rtu-01.point.temperature.type=float32
# ★ 四种可能 ABCD / CDAB / BADC / DCBA —— 用 probe 现场判，国内仪表常见 CDAB
device.rtu-01.point.temperature.order=ABCD
device.rtu-01.point.temperature.unit=°C
# 量程：字序配错时的最后一道防线（越界判 BAD，不让垃圾数据流下去）
device.rtu-01.point.temperature.min=-40
device.rtu-01.point.temperature.max=120

# ── 湿度（示例：寄存器 0x0002，Float32）──
device.rtu-01.point.humidity.area=holding
device.rtu-01.point.humidity.offset=2
device.rtu-01.point.humidity.type=float32
device.rtu-01.point.humidity.order=ABCD
device.rtu-01.point.humidity.unit=%RH
device.rtu-01.point.humidity.min=0
device.rtu-01.point.humidity.max=100

# ── 可选：报警输出（有些型号带继电器/告警位）──
# device.rtu-01.point.alarm.area=discrete
# device.rtu-01.point.alarm.offset=0
# device.rtu-01.point.alarm.type=bool
# device.rtu-01.point.alarm.unit=
