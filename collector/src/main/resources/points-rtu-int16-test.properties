# ─────────────────────────────────────────────────────────────
# 「16 位整数 + 缩放」回归测试点表（用虚拟串口跑，不需要真硬件）
#
# 目的：验证 PointDef 新增的 INT16 / UINT16 + scale 能力。
#      真实国产仪表绝大多数就是这种形态（温度 253 = 25.3℃），
#      没有这条能力，真传感器接上也读不了。
#
# 配合 collector\run-rtu-slave.cmd（RtuSlaveMain）使用，它在这几个寄存器里放了固定值：
#   holding 0..1 = Float32 25.6      （验证 FLOAT32 老路径没坏）
#   holding 2    = 每秒 +1 的计数器   （验证 UINT16 + 活数据）
#   holding 3    = 0xFFCB = int16 -53 → -5.3℃   （验证补码/负数）
#   holding 4    = 501                → 50.1%RH  （验证 UINT16 + scale）
#
# 跑法：
#   collector\run-rtu-slave.cmd --com COM5 --seconds 120
#   collector\run-collect.cmd --points collector\src\main\resources\points-rtu-int16-test.properties --cycles 5
# 期望：
#   temperature = -5.30°C     humidity = 50.10%RH     counter 递增
# ─────────────────────────────────────────────────────────────

device.int16-test.portType=rtu
device.int16-test.comPort=COM6
device.int16-test.baudRate=9600
device.int16-test.dataBits=8
device.int16-test.stopBits=1
device.int16-test.parity=none
device.int16-test.rs485Mode=false
device.int16-test.unitId=1
device.int16-test.periodMillis=1000
device.int16-test.points=temperature,humidity,counter,float_temp

# 负温度：0xFFCB 按 int16 = -53，scale 0.1 → -5.3℃
# ⚠️ 注意这里**没有 order** —— 16 位只有一个寄存器，天生没有字序
device.int16-test.point.temperature.area=holding
device.int16-test.point.temperature.offset=3
device.int16-test.point.temperature.type=int16
device.int16-test.point.temperature.scale=0.1
device.int16-test.point.temperature.unit=°C
device.int16-test.point.temperature.min=-40
device.int16-test.point.temperature.max=80

# 湿度：501 × 0.1 = 50.1 %RH
device.int16-test.point.humidity.area=holding
device.int16-test.point.humidity.offset=4
device.int16-test.point.humidity.type=uint16
device.int16-test.point.humidity.scale=0.1
device.int16-test.point.humidity.unit=%RH
device.int16-test.point.humidity.min=0
device.int16-test.point.humidity.max=100

# 计数器：不缩放，验证「scale 省略 = 1.0」
device.int16-test.point.counter.area=holding
device.int16-test.point.counter.offset=2
device.int16-test.point.counter.type=uint16

# 老路径回归：Float32 仍然要能读（order 依然必填）
device.int16-test.point.float_temp.area=holding
device.int16-test.point.float_temp.offset=0
device.int16-test.point.float_temp.type=float32
device.int16-test.point.float_temp.order=ABCD
device.int16-test.point.float_temp.unit=°C
