# ─────────────────────────────────────────────────────────────
# 真传感器点表 —— 艾克姆 IKM10000WS01 温湿度变送器（RS485 / Modbus-RTU）
#
# 已知参数（来自厂商产品图，2026-10-25 确认）：
#   供电      (5~30) VDC，有防反接
#   协议      Modbus-RTU，RS-485
#   波特率    9600（默认）· 数据格式 8N1 · 从机地址 1（默认）
#   温度量程  -40 ~ +80 ℃，分辨率 0.1℃
#   湿度量程  0 ~ 100 %RH，分辨率 0.1%RH
#   端子顺序  ① 电源正 / ② 电源负 / ③ 485A / ④ 485B
#   型号      IKM10000WS01 · 固件 V025002
#
# ⚠️ 下面 4 个值要实测确认（厂商图里没给寄存器表）：
#   ① area     是 holding(FC03) 还是 input(FC04)？
#   ② offset   0x0000 还是 0x0001 起？
#   ③ 温度/湿度 哪个在前？
#   ④ int16 还是 uint16？（温度要 int16 才能表示负温度）
#
# 确认方法（一条命令，会四个区域 × 四种字序全试一遍）：
#   collector\run-probe.cmd --com COM7 --baud 9600 --unit 1
#   看到 253 这种"看起来像 25.3℃ 的整数"就说明地址对了
# ─────────────────────────────────────────────────────────────

device.sensor-01.portType=rtu
device.sensor-01.comPort=COM7
device.sensor-01.baudRate=9600
device.sensor-01.dataBits=8
device.sensor-01.stopBits=1
device.sensor-01.parity=none
device.sensor-01.rs485Mode=false
device.sensor-01.unitId=1
device.sensor-01.periodMillis=1000
device.sensor-01.points=temperature,humidity

# 温度：**offset 1**（实测：offset 0 是湿度，原假设反了）
device.sensor-01.point.temperature.area=holding
device.sensor-01.point.temperature.offset=1
device.sensor-01.point.temperature.type=int16
device.sensor-01.point.temperature.scale=0.1
device.sensor-01.point.temperature.unit=°C
device.sensor-01.point.temperature.min=-40
device.sensor-01.point.temperature.max=80

# 湿度：**offset 0**
device.sensor-01.point.humidity.area=holding
device.sensor-01.point.humidity.offset=0
device.sensor-01.point.humidity.type=uint16
device.sensor-01.point.humidity.scale=0.1
device.sensor-01.point.humidity.unit=%RH
device.sensor-01.point.humidity.min=0
device.sensor-01.point.humidity.max=100
