# ============================================================
#  点表 —— 现场约定全部在这里，代码里不写死任何设备的字序
# ============================================================
#  为什么字序是配置项：真设备不会告诉你它用 CDAB 还是 ABCD。
#  办法是先读一次看数值像不像量纲（ABCD 解出 1e29 就是错了），
#  确认后把结论写进这里；换一台表只改这一行，代码不动。
# ============================================================

# ---------- 设备台账 ----------
device.sim-01.host=127.0.0.1
device.sim-01.port=1502
device.sim-01.unitId=1
# 每台设备可以有自己的采样周期（现场每台表的刷新率不一样）
device.sim-01.periodMillis=1000
device.sim-01.points=temperature,runtime_hours,motor_running,alarm

# ---------- 点位：temperature（Float32，占 2 寄存器，CDAB）----------
device.sim-01.point.temperature.area=holding
device.sim-01.point.temperature.offset=0
device.sim-01.point.temperature.type=float32
device.sim-01.point.temperature.order=CDAB
device.sim-01.point.temperature.unit=°C

# ---------- 点位：runtime_hours（UInt32，占 2 寄存器，ABCD）----------
# 同一台设备两种字序是正常的，所以 order 必须按点位配
device.sim-01.point.runtime_hours.area=holding
device.sim-01.point.runtime_hours.offset=2
device.sim-01.point.runtime_hours.type=uint32
device.sim-01.point.runtime_hours.order=ABCD
device.sim-01.point.runtime_hours.unit=h

# ---------- 点位：motor_running（线圈，可写）----------
device.sim-01.point.motor_running.area=coil
device.sim-01.point.motor_running.offset=0
device.sim-01.point.motor_running.type=bool

# ---------- 点位：alarm（离散输入）----------
device.sim-01.point.alarm.area=discrete
device.sim-01.point.alarm.offset=0
device.sim-01.point.alarm.type=bool

# ============================================================
#  扩到多台时（第 4 步再做）：把 sim-01 整段复制，改 host/port/unitId 即可。
#  同一台网关后面挂多台表时，host/port 相同、unitId 不同。
# ============================================================
